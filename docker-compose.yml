services:
  inventario:
    build: .
    container_name: inventario-ti
    restart: unless-stopped
    # Debe coincidir con el dueño de la carpeta de datos (en Synology: ls -n)
    user: "${INVENTARIO_UID:-1000}:${INVENTARIO_GID:-1000}"
    ports:
      # En el Synology: http://<ip-del-NAS>:8800
      - "8800:8000"
    volumes:
      # Carpeta donde vive la base de datos; en el NAS se define en .env
      - "${INVENTARIO_DATOS:-./data}:/datos"
    environment:
      TZ: America/Mexico_City
      INVENTARIO_ADMIN_PASSWORD: ${INVENTARIO_ADMIN_PASSWORD:-}
      INVENTARIO_LLAVE: ${INVENTARIO_LLAVE:-}
      INVENTARIO_COOKIE_SEGURA: ${INVENTARIO_COOKIE_SEGURA:-0}
      # Detrás de un proxy inverso (Render, Nginx): su IP, para que el límite de peticiones
      # cuente a cada persona y no a todas juntas. Vacío = no confiar en ningún proxy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
